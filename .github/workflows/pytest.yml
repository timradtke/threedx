name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "latest"

    - name: Install Python
      run: uv python install 3.12

    - name: Install dependencies
      run: |
        uv sync --python 3.12 --dev

    - name: pytest
      run: uv run pytest