name: mypy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "latest"

    - name: Install Python
      run: uv python install 3.12

    - name: Install dependencies
      run: |
        uv sync --python 3.12 --extra dev --extra graphics --extra docs

    - name: mypy
      run: uv run mypy src